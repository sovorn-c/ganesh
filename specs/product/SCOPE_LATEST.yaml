---
feature_name: Ganesh complete production release
core_value: Persistent evidence-grounded research supervision with bounded autonomous
  work and accountable human decisions.
summary: |-
  One complete local-first production release for individual researchers, covering iterative research from orientation and literature through design, ethics, analysis, interpretation, writing and supervisor exchange.

  Shipping includes enforceable permissions and human authority, durable data and recovery, accessible terminal operation, user-controlled local execution, reliable installation, private diagnostics, documentation and qualified-human evaluation. Epic order is engineering sequence, never permission to cut later outcomes.
actors:
- Individual researcher and designated project owner
- Real academic supervisor providing attributed feedback through packet exchange
- Relevant external institutional and community authorities
in_scope:
- id: R01
  epic_id: e01
  outcome: Verified development and runtime baseline
  value: Developers can reproduce the approved runtime and commands without relying
    on global Pi configuration.
  success_criteria:
  - Node 24 target and dependency/license choices are documented; Pi SDK/TUI compatibility is treated as settled from prior verification.
  - Locked dependency installation and real dev, test, build, lint, typecheck and
    preflight commands run repeatably; setup failures have remediation.
  - Clean-machine checks expose missing local tools and permission-mode configuration; product launch is completed in e14 and distribution in e18.
- id: R02
  epic_id: e02
  outcome: Durable versioned research projects
  value: Researchers can inspect and retain exact research state independently of
    conversation history.
  success_criteria:
  - Immutable artifact/source versions and exact dependency references survive restart
    with atomic registration and explicit missing/corrupt content.
  - Project ownership, branch references and history use concurrent-writer exclusion
    and expected-version checks; offline records remain readable.
  - Session navigation cannot roll back state; schema versions and storage permissions
    support the recovery and migration work in e15.
- id: R03
  epic_id: e03
  outcome: Enforced data-use and capability controls
  value: Restricted research material and human authority stay protected across every
    execution and disclosure path.
  success_criteria:
  - Classification, destination/purpose permissions, inherited restrictions and cross-branch
    revocation govern imports, pasted text, prompts, attachments, summaries, compaction,
    export and diagnostics.
  - Agents and imported instructions cannot acquire owner authority, credentials, direct canonical writes, or bypass the selected execution mode and per-project bash guard; curated Pi loading and built-in commands are tested for policy bypass.
  - Current policy is enforced at dispatch, every external operation, resume and acceptance;
    in-flight revocation and reviewed declassification retain truthful limits.
- id: R04
  epic_id: e04
  outcome: Human commitments and research alternatives
  value: Owners adopt exact options, preserve objections and understand the impact
    of changes.
  success_criteria:
  - Explicit local approval binds displayed packet, option and dependencies; forged,
    stale and duplicate actions cannot create partial or repeated commitments.
  - Approval, rejection, deferral, revision, reopening, archival and supersession
    retain historical dispositions and distinguish current readiness.
  - Alternative branches stay independent; adoption triggers transitive impact review;
    reasoned scholarly overrides retain dissent and cannot waive safety or external
    authorization.
- id: R05
  epic_id: e05
  outcome: Bounded autonomous work and specialist coordination
  value: Approved research work proceeds without repeated delegation while preserving
    limits and human control.
  success_criteria:
  - Supervisor, Discovery, Evidence, Methodology and Reviewer roles receive least-privilege
    input snapshots and return versioned candidate outputs, diagnostics and disagreements.
  - Exact contracts and standing permissions bind scope and finite token/call/time
    limits; atomic cumulative reservation and accounting survive retries, concurrent
    runs, revisions and restart.
  - Cancellation fences new dispatch and current acceptance; late outputs follow quarantine/retention
    policy; unknown pricing and uncertain provider outcomes are not treated as zero.
  - Provider failures, timeouts, bounded retries, consented destination selection
    and session subscription rebinding degrade honestly without unauthorized fallback.
  - 'Known provider pricing supports an enforced cumulative spend cap: reserve before
    dispatch and preserve spent and reserved cost across retries, revisions and restart;
    unknown pricing cannot satisfy a required monetary guarantee.'
- id: R06
  epic_id: e06
  outcome: Local import and source inspection
  value: Researchers acquire and inspect required materials without losing source
    identity or provenance.
  success_criteria:
  - Text-based PDF, DOCX, Markdown, text, BibTeX, RIS, CSV and XLSX imports preserve
    originals, versions, stable locators, access level and extraction diagnostics.
  - Scanned input reports unsupported extraction unless external OCR provenance exists;
    corrupt, oversized and hostile files fail safely.
  - Metadata deduplication distinguishes related versions rather than silently merging
    them; document/viewer handoff enforces current permissions.
- id: R07
  epic_id: e07
  outcome: Located evidence and accountable claims
  value: Research claims remain inspectable, qualified and linked to supporting and
    challenging evidence.
  success_criteria:
  - Structured reading, extraction and critical appraisal distinguish author claims,
    measured findings, inference and human interpretation with exact source locators.
  - Claim and citation verification distinguishes bibliographic identity from substantive
    support and inaccessible full text; missing fields and quotations are never invented.
  - Evidence matrices and synthesis retain disagreements, limitations, corrections
    and retractions; affected claims trigger reassessment.
- id: R08
  epic_id: e08
  outcome: Literature discovery and contribution challenge
  value: Researchers can build a defensible corpus and challenge scoped gap and contribution
    proposals.
  success_criteria:
  - Landscape mapping, review protocols, query design, authorized retrieval and citation
    exploration retain search dates, query versions, access rights, failures and coverage
    limits.
  - Screening decisions, eligibility amendments and uncertainty queues remain inspectable;
    no universal paper-count or saturation threshold is imposed.
  - Gap and contribution proposals receive counter-search and contrary-evidence review;
    no result claims universal novelty or exhaustive absence.
- id: R09
  epic_id: e09
  outcome: Research framing and method-sensitive design
  value: Researchers compare coherent questions, theories and designs suited to their
    methodological context.
  success_criteria:
  - Orientation, problem framing, RQ alternatives, constructs, theory/frameworks and
    philosophy/positionality distinguish human views from agent inference.
  - Methodology comparison, sampling/recruitment planning, measurement/instrument
    design, rights and pilot plans explain fit and feasibility without executing recruitment.
  - Quantitative, qualitative, mixed-methods and artifact-evaluation/design-science
    profiles cover empirical social science, IS, HCI, education and computing.
  - Alignment audits and analysis plans retain method-specific assumptions, exploratory/confirmatory
    status, escalation and uncertainty rather than universal rigor rules.
- id: R10
  epic_id: e10
  outcome: Ethics and external authorization
  value: Researchers prepare and track ethical, institutional and cultural obligations
    without confusing internal approval with external authority.
  success_criteria:
  - Risk registers, data-management and retention plans identify activity-specific
    institutional/community requirements and evidence.
  - New Zealand institutional and cultural guidance cites current authoritative material
    and records consultation limits instead of generic certification.
  - External authorization scope, applicability basis, expiry and withdrawal block
    affected work; human scholarly approval never manufactures permission.
- id: R11
  epic_id: e11
  outcome: User-controlled local analysis and test execution
  value: Researchers can use the language and tools already available in their environment while retaining useful provenance and diagnostics.
  success_criteria:
  - User-selected languages and tools record exact inputs, command or script versions, parameters, outputs, diagnostics and environment details when available; repeatability is reported rather than guaranteed across arbitrary environments.
  - Execution follows Pi-compatible ask, approve, and full-access modes plus a per-project configurable bash guard; full-access is an explicit local-risk choice, not a sandbox guarantee. Missing tools and packages are surfaced, and installation follows the selected mode.
  - Quantitative, qualitative, mixed-method integration and artifact-evaluation workflows expose appropriate diagnostics and limitations; externally produced outputs are marked reported unless independently reproduced.
- id: R12
  epic_id: e12
  outcome: Study progress and protocol change
  value: Researchers track an ongoing study and assess amendments and deviations without
    rewriting history.
  success_criteria:
  - Progress, protocol versions, reported execution evidence, amendments and deviations
    remain attributed; retrospective changes stay labelled retrospective.
  - Changes trigger method/ethics/analysis impact review and current readiness checks
    rather than blanket reapproval or silent continuation.
  - Late project entry supports useful consultation while reported prior commitments
    remain distinct from authenticated Ganesh decisions.
- id: R13
  epic_id: e13
  outcome: Interpretation writing and supervisor exchange
  value: Researchers develop traceable writing and resolve review feedback throughout
    the lifecycle.
  success_criteria:
  - Interpretation and writing link assertions to evidence and analysis, qualify negative/inconclusive
    findings, and expose unsupported citations, limitations and AI contribution.
  - Review produces ranked version-linked issues without rewriting originals; request/response
    cycles preserve attributed supervisor feedback, dissent and decision history.
  - Markdown/DOCX drafts, BibTeX/RIS references, CSV tables and versioned review packets
    export only permitted content with visible format and provenance limits.
- id: R14
  epic_id: e14
  outcome: Accessible terminal research workspace
  value: Owners can launch Ganesh and steer any research activity using inspectable
    accessible local interactions.
  success_criteria:
  - ganesh [project-folder] reuses Pi terminal UI with project intake, contextual
    help, alternatives, exact-version confirmation, evidence inspection and native
    local viewers.
  - Keyboard-only navigation, focus, non-colour status, readable text and supported
    screen-reader/terminal combinations complete critical flows; unsupported access
    paths are explicit release blockers.
  - Incomplete context and late entry do not force a stage pipeline; working/waiting/blocked
    state, budgets, cancellation and offline inspection are understandable.
- id: R15
  epic_id: e15
  outcome: Recovery portability and controlled deletion
  value: Owners recover and move projects without losing commitments or resurrecting
    revoked data use.
  success_criteria:
  - Versioned project export/restore checks integrity and current permissions; migrations,
    backups and restore drills preserve permitted history and evidence resolution.
  - Crash injection, interrupted writes, disk-full, corruption and concurrent launches
    produce no partial approvals or silent canonical changes; uncertain external operations
    are reconciled before retry.
  - Deletion propagates through derived content, caches and backup policy while retaining
    only permitted audit stubs; stale restores cannot silently reinstate withdrawn
    grants and external disclosures are not promised recall.
- id: R16
  epic_id: e16
  outcome: Private operational diagnostics and reliability
  value: Users can diagnose failures and maintain a reliable local workspace without
    exposing research material.
  success_criteria:
  - Structured redacted diagnostics, correlation IDs, health/preflight checks and
    opt-in diagnostic exports disclose neither secrets nor participant content by
    default.
  - Bounded provider retry/rate/time limits, storage/resource limits and documented
    performance budgets are exercised on representative large projects; cancellation
    stays responsive.
  - Runbooks cover provider outage, credential rotation, disk exhaustion, recovery,
    incident response and vulnerability reporting; logs have retention/deletion controls.
- id: R17
  epic_id: e17
  outcome: Scholarly and adversarial release qualification
  value: The complete product is evaluated for research quality and non-waivable safety
    rather than schema validity alone.
  success_criteria:
  - All AC-01 through AC-20 have observable behavioral evidence; deterministic integration
    and adversarial tests include approval forgery, stale state, malicious imports,
    permission races, cancellation and recovery.
  - Qualified humans assess representative cases across all four method profiles and
    supported disciplinary contexts with explicit rubrics, escalation and retained
    disagreements.
  - Competency metadata, worked failure examples, skill sources/licenses and output
    provenance are validated; statistical or scholarly certification is never inferred.
  - Every approved scope outcome has evidence and critical safety defects block release;
    recurring checks run locally with an automation-ready documented gate.
- id: R18
  epic_id: e18
  outcome: Installable maintained local release
  value: Researchers receive a verified distributable product with complete operating
    and support documentation.
  success_criteria:
  - Clean supported local environments launch the packaged CLI and pass smoke checks;
    upgrade, migration compatibility, rollback/recovery and uninstall preserve user
    research data as documented.
  - Reproducible packaging, artifact integrity, dependency/license inventory and applicable
    signing requirements are verified for the chosen distribution channel.
  - User/developer/accessibility/privacy/local-execution guides, examples, limitations,
    release notes and support/maintenance procedures ship with the product.
  - Local Conventional Commits/SemVer release procedures require explicit publication
    authorization; no hosted service or mandatory remote CI is introduced; all release
    gates are satisfied before shipment.
out_of_scope:
- item: Built-in OCR
  reason: Requires separate extraction quality and infrastructure; externally OCR-processed
    material remains supported.
  disposition: intentional_exclusion
- item: Official academic, ethics, clinical, statistical, or legal certification
  reason: Responsibility remains with qualified humans and external authorities.
  disposition: intentional_exclusion
- item: Autonomous participant recruitment, contact, consent, or data collection
  reason: Participant-facing actions require human and external authorization outside
    the assistant.
  disposition: intentional_exclusion
- item: Physical experiment execution or laboratory equipment control
  reason: Physical execution is outside the local software support boundary.
  disposition: intentional_exclusion
- item: Automatic external submissions
  reason: Owners retain control of external submission.
  disposition: intentional_exclusion
- item: Shared hosted accounts or live multi-user editing
  reason: The approved release serves one local owner with packet exchange.
  disposition: intentional_exclusion
- item: Universal disciplinary competence
  reason: Method-sensitive supported contexts are bounded and require escalation.
  disposition: intentional_exclusion
- item: Paywall evasion or redistribution without rights
  reason: Access and redistribution must remain lawful and authorized.
  disposition: intentional_exclusion
- item: Model training, bundled model weights, or a separate web application
  reason: Reuse Pi and authorized providers; do not introduce an independent web UI
    or training stack.
  disposition: intentional_exclusion
- item: Guaranteed offline AI inference
  reason: Saved records work offline; authorized remote models are allowed.
  disposition: intentional_exclusion
- item: Hosted CI and automatic publication
  reason: Local solo-git is approved; reproducible local release gates are required
    instead.
  disposition: future_work_not_committed
constraints:
- One complete local-first release, not a reduced feature set disguised as delivery
  sequencing
- Terminal-first, local-folder operation; the initial validation host may be macOS, but macOS is not an inherent product boundary
- TypeScript and Node.js 24 LTS target; Pi SDK/TUI compatibility is treated as settled from prior verification
- Reuse Pi SDK and existing terminal UI through a curated Ganesh launcher and extensions
- Reuse current provider integrations, workflows, and relevant skills; provider authorization, credentials, limits, failures, provenance, and destination restrictions remain explicit
- SQLite canonical project records plus local artifact files; no graph database is required
- Research commitments and permissions are independent of conversation history
- Remote model use requires authorization for the transmitted material and destination
- Restricted material remains local; no unauthorized cloud fallback
- Fully offline AI is not a release requirement; saved project records remain inspectable
  offline
- User-controlled local analysis and test execution is language-agnostic, follows Pi-compatible ask, approve, and full-access modes, and supports a per-project bash guard
- Full-access is an explicit local-risk choice; Ganesh does not claim sandbox containment
- Missing tools and packages are surfaced, and installation follows the selected execution mode
- External viewers support full-document inspection without a separate Ganesh web
  application
- New local imports remain local-only until classified and authorized for a destination
  and purpose
- Approved work contracts permit bounded autonomous work without repeated delegation
  prompts
- Finite token, call, and time limits persist across restarts; known pricing also
  permits a spend cap
supported_methodological_contexts:
- Empirical social science
- Information Systems
- HCI
- Education
- Computing and design-science research
method_profiles:
- Quantitative
- Qualitative
- Mixed methods
- Artifact evaluation and design science
required_formats:
  import:
  - text-based PDF
  - DOCX
  - Markdown
  - text
  - BibTeX
  - RIS
  - CSV
  - XLSX
  export:
  - Markdown
  - DOCX
  - BibTeX
  - RIS
  - CSV
  - versioned project packets
  - review packets
  scanned_pdf: Report extraction as unsupported unless externally OCR-processed with
    provenance
success_criteria:
- Human commitments reference exact artifact and dependency versions
- Evidence and contrary findings remain inspectable and attributable
- Sensitive-data permissions govern derived content and all disclosure paths
- Interrupted work recovers without partial approvals or silent commitment changes
- Analysis outputs retain input, code, environment, parameter, and diagnostic provenance
- Research cases are assessed by qualified humans as well as deterministic tests
- Negative and inconclusive findings are valid outcomes
- All R01–R18 outcomes pass their epic acceptance evidence before a production release.
- No approved outcome is silently deferred; failed safety gates block shipment.
references:
- planning-context.yaml
- tech-architecture/tech-stack.md
- tech-architecture/DESIGN_PLAN_LATEST.md
- adr/0001-research-authority-outside-pi-sessions.md
- adr/0002-focused-authority-separated-commands.md
- docs/03-agents-and-skills.md
- docs/05-decisions-and-acceptance.md
status: scoped_for_complete_release
confirmation_basis: Confirmed discovery plus owner-delegated production blueprint;
  technical choices remain verification obligations.
