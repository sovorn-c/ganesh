status: confirmed
source_of_truth: /Users/sovorn/dev/harness/conv.md
product: Ganesh
vision: >-
  Give an individual researcher a local-first supervisor that helps carry a research
  project from question to defensible contribution while keeping consequential
  commitments, evidence provenance, permissions, and durable project state under
  human control.
experience:
  interface: terminal-first local-folder workflow using Pi's existing terminal UI
  collaboration: one human researcher with a real supervisor represented through attributed packets
  operation: bounded autonomous work with visible contracts, checkpoints, budgets, cancellation, and recovery
  execution: user-controlled local commands and analysis in the language and tools the project requires
  privacy: local by default; remote model or provider use requires destination- and purpose-specific authorization
architecture_intent:
  runtime: TypeScript and Node.js 24 LTS target with reused Pi SDK/TUI
  persistence: SQLite canonical records plus local artifact files
  permissions: Pi-compatible ask, approve, and full-access modes with a configurable per-project bash guard
  containment: full-access is an explicit local-risk choice; no sandbox guarantee is claimed
release_intent:
  scope: one complete local-first research lifecycle release
  coverage: topic exploration, evidence work, methodology, ethics and data management, protocol, analysis, interpretation, writing, review, supervision, recovery, and distribution
  planning_level: 18 epics only; stories, implementation tasks, and application code remain deferred
non_goals:
  - Separate Ganesh web application
  - Graph database
  - Mandatory Python or R runtime
  - Guaranteed sandbox or strong isolation for user-authorized full-access commands
  - Autonomous participant recruitment, consent, data collection, or external submission
  - Scholarly, statistical, legal, ethics, or clinical certification
success_condition: >-
  The researcher can inspect what Ganesh knows, why it proposes an action, which
  permissions apply, what changed, and what evidence supports each consequential
  commitment, including after interruption or recovery.
