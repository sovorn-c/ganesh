---
id: e19
title: Researcher-facing workspace polish and continuous verification
scope_ids:
- R19
outcome: Researchers understand Ganesh immediately, can find the next bounded research action, and receive honest release and verification status.
boundaries:
  includes:
  - First-run Ganesh identity, a concise launch banner or initial message, and a bounded Supervisor context that is real runtime context rather than inert curated-resource text.
  - Returning-workspace guidance and contextual next-action presentation over the existing `/ganesh-*` command and Pi extension seam.
  - Focused entry points for orientation, landscape mapping, screening, appraisal, review, and specialist coordination that reuse existing stores, work contracts, capability checks, and disagreement handling.
  - A small executable competency subset for orientation, landscape mapping, screening, appraisal, and review, with provenance, uncertainty, unsupported-context handling, and human escalation.
  - Visible execution-mode guidance when local execution matters; `ask`, `approve`, and `full-access` remain explicit user choices and are never auto-selected.
  - Release/support messaging that distinguishes maintained local npm tarball, private/unpublished distribution, and shipment blocked by B06, publication authorization, or production-readiness gates.
  - GitHub Actions on push and pull request running the existing Node.js 24 local gates: preflight, tests, typecheck, lint, build as required by those commands, and local qualification.
  excludes:
  - Twenty-two mechanical Pi skill files, a second workflow engine, a separate web application, or a new agent runtime.
  - Automatic execution-mode selection, unrestricted shell authority, or claims that full-access is a sandbox.
  - Automatic npm publication, deployment, tagging, production-ready status, or completion of B06 qualified-human evaluation.
  - New support claims for Darwin, Windows, or any OS/architecture combination not verified by the support matrix.
  - Reopening E02–E18 foundations, changing project schemas, `PacketKind`, `OWNER_OPERATIONS`, disclosure rules, E15 deletion/restore contracts, or research-data storage semantics.
  - Changes to global Pi configuration, hosted research accounts, or remote model authorization policy.
depends_on:
- e18
acceptance_outcomes:
- A new researcher can identify Ganesh and its bounded Supervisor role at first launch, understand the next safe action, and return to an existing project without repeated onboarding noise.
- Contextual next-action guidance and focused `/ganesh-*` entry points invoke existing orientation, landscape, screening, appraisal, review, and specialist coordination behavior while preserving owner authority, provenance, budgets, cancellation, and disagreement retention.
- The five selected competencies are executable and inspectable as runtime affordances; unsupported contexts, uncertainty, provenance, and human escalation remain visible, and catalog metadata is not misrepresented as full skill implementation.
- Local execution guidance is visible at the point of need, while no execution mode is selected without the researcher.
- Release messaging and qualification output clearly distinguish local tarball maintenance, private/unpublished state, shipment blockers, and production readiness.
- GitHub Actions runs the same Node.js 24 local gates on push and pull request, reports failures honestly, and does not expand the verified support matrix beyond Linux x64 Node.js 24 or substitute for B06.
architecture_decisions:
- Reuse the existing `runWorkspace`, Pi runtime, and `registerWorkspaceCommands` seams; do not create a second workflow engine or UI.
- Keep Supervisor context bounded and policy-relevant, with authority enforced by existing capability modules rather than prompt text.
- Represent the five selected competencies as a focused runtime affordance layer over existing domain stores and work contracts; do not mirror the entire competency catalog as files.
- Treat GitHub Actions as a verifier of existing local commands, not a new release, publication, qualification, or support-claim authority.
- Permit E19 to extend the workspace surface even though E18 froze it for the distribution slice; preserve all E18 data, packaging, and release contracts.
