status: complete
planning_stage: complete
story_planning: complete
risk: P0
hard_gates:
- No implicit execution mode may be introduced.
- CI must run the existing Node.js 24 gates without claiming Darwin, Windows, B06, scholarly certification, or production readiness.
- Existing capability, provenance, cancellation, data-preservation, and authority contracts must remain enforced through the new affordances.
plan_pins:
  supervisor_context_seam: interactive-mode-initial-fields
  supervisor_context_rationale: >-
    PiWorkspaceTuiPort currently passes empty InteractiveMode initial fields.
    Locked Pi 0.85.1 InteractiveMode accepts initialMessage and initialMessages.
    E19 composes bounded Ganesh Supervisor context and launch identity through
    those fields. pi:base-prompt stays an inert curated resource and is not
    Supervisor identity. Authority stays in capability-broker, not prompt text.
  executable_competencies:
  - id: comp-01
    command: /ganesh-orient
    store: recordOrientation / inspectOrientation / listOrientations
  - id: comp-02
    command: /ganesh-landscape
    store: recordLandscapeMap / getLandscapeMap / listLandscapeMaps
  - id: comp-05
    command: /ganesh-screen
    store: recordScreeningDecision / listScreeningDecisions
  - id: comp-08
    command: /ganesh-appraise
    store: recordAppraisal / getAppraisal / listAppraisals
  - id: comp-22
    command: /ganesh-review
    store: openReviewCycle / inspectReviewCycle / listReviewCycles
  specialist_entry_point:
    command: /ganesh-specialist
    store: queueRoleRun / inspectWork / recordDisagreement
    competency_id: none
  catalog_remainder: metadata-only
  execution_mode: GANESH_EXECUTION_MODE plus checkExecutionMode; never default ask, approve, or full-access
  ci_forge: github-actions
  ci_runner: ubuntu-latest
  ci_node: "24"
  ci_commands:
  - npm run preflight
  - npm test
  - npm run typecheck
  - npm run lint
  - npm run build
  - npm run qualify
  ci_authority: verifier-of-local-gates
  hosted_ci_flag: remains-false
  support_matrix: unchanged; Linux x64 Node.js 24 only
  additive_read_apis: listOrientations, listAppraisals, listReviewCycles; inspect capability only; no schema change
requirement_deltas:
- story_id: e19s01
  type: ADDED
  requirement: First-run identity, bounded Supervisor context and returning next-action
  after: Launch composes Ganesh identity, a bounded Ganesh Supervisor role statement, and one next safe action from current project records. Created and reopened launches differ. Supervisor context is passed as real InteractiveMode initial fields, not pi:base-prompt.
- story_id: e19s01
  type: MODIFIED
  requirement: Empty InteractiveMode initial context
  before: >-
    PiWorkspaceTuiPort constructed InteractiveMode with empty initial fields
    and no Ganesh identity banner. runWorkspace success text only said current
    records are ready.
  after: TuiPort receives composed launch guidance. Created launches identify Ganesh and the bounded Supervisor. Reopened launches skip first-run onboarding noise and present a returning next action. --print-launch prints the same guidance text.
- story_id: e19s02
  type: ADDED
  requirement: Focused research entry points
  after: /ganesh-orient, /ganesh-landscape, /ganesh-screen, /ganesh-appraise, /ganesh-review, and /ganesh-specialist inspect or record through existing stores and work APIs. Help lists them. Workers cannot exercise owner mutations.
- story_id: e19s02
  type: MODIFIED
  requirement: Workspace help catalog
  before: presentHelp listed help, alternatives, confirm/reject/defer, inspect, viewer, status, access, and cancel.
  after: Help also lists the six research entry points. Alternatives still inspect without adopting a branch.
- story_id: e19s03
  type: ADDED
  requirement: Executable competency subset
  after: comp-01, comp-02, comp-05, comp-08, and comp-22 are inspectable runtime affordances with provenance, uncertainty, unsupported-context, and human-escalation fields. The other inventory rows remain metadata. No 22-file skill catalog is written.
- story_id: e19s03
  type: MODIFIED
  requirement: Competency inventory as metadata-only qualification artifact
  before: validateCompetencyInventory treated all inventory rows as metadata for qualification. Workspace had no executable subset and no metadata-versus-runtime distinction.
  after: Workspace affordances mark only the five selected competencies executable. Inventory validation still must not infer scholarly certification. A claim that all 22 rows are implemented skills fails closed.
- story_id: e19s04
  type: ADDED
  requirement: Execution-mode guidance at point of need
  after: When a workspace action needs local execution, the workspace shows the current checkExecutionMode report. Empty or invalid GANESH_EXECUTION_MODE stays unselected. Guidance never writes a mode and never calls full-access a sandbox.
- story_id: e19s05
  type: ADDED
  requirement: Honest release states and GitHub Actions verifier
  after: Product and qualify output distinguish maintained local npm tarball, private/unpublished distribution, and shipment blocked by B06, publication authorization, or production-readiness. A GitHub Actions workflow on push and pull_request runs the existing Node.js 24 local gates on ubuntu-latest. The workflow does not publish, tag, deploy, or mark Darwin/Windows/B06/production-ready.
- story_id: e19s05
  type: MODIFIED
  requirement: Hosted CI exclusion from E18 distribution freeze
  before: E18 excluded hosted CI and froze src/workspace/**. Qualification hostedCi and productionReady stayed false. Qualify rendered Scope Outcomes R01–R18.
  after: E19 adds GitHub Actions as a verifier of existing local commands only. hostedCi and productionReady remain false. R19 is listed in qualify output. src/workspace/** may change for E19 polish. Support matrix and packaging contracts stay as E18 left them.
