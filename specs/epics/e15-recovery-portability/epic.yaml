requirement_deltas:
- story_id: e15s01
  type: ADDED
  requirement: Versioned project packet export with integrity and current-permission checks
  after: An owner-scoped command writes a directory project packet with a structured
    manifest, schema version, per-file hashes and explicit omission notices. Restricted
    bytes are omitted. Current disclosure policy is evaluated at export time. Records
    survive packet inspection after close.
- story_id: e15s01
  type: MODIFIED
  requirement: Ready-project feature schema initialization
  before: Writable ready-project open idempotently ensured E04, E06, E05, E07 and E08
    additive tables; schema marker version 1 remained unchanged. createSchema and
    migrateSchema ensured E03 through E08.
  after: New-project creation, explicit migration and writable ready-project open also
    idempotently ensure additive E15 portability tables without changing schema marker
    version 1. Read-only, migration-required and unknown-future opens never mutate
    schema; missing E15 tables return portability-schema-unavailable.
- story_id: e15s03
  type: ADDED
  requirement: Crash, disk-full, corruption and concurrent-launch hardening
  after: Injected crash, ENOSPC and corruption at local write boundaries leave no
    partial approvals or silent current-reference changes. A pid-reentrant write lock
    at .ganesh/write.lock admits same-process handles and denies a second live process.
    Pending lifecycle operations stay pending until current-policy resume.
- story_id: e15s03
  type: MODIFIED
  requirement: Artifact write-failure injection and writable project open
  before: ArtifactVersionInput.failAt accepted before-finalize, after-finalize-before-register,
    after-commit and after-register. openProject allowed multiple processes to open
    the same writable project. recoverProject removed temporary files and retained
    the last complete database state.
  after: failAt also accepts disk-full, which aborts with ENOSPC and leaves no new
    current reference. Writable open and create acquire a pid-reentrant exclusive
    lockfile; a foreign live pid is blocked. recoverProject still removes temporaries,
    reports corrupt/missing artifacts without rewriting history, and does not complete
    pending lifecycle operations.
- story_id: e15s02
  type: ADDED
  requirement: Backup, restore, migrations and restore drills
  after: An owner-scoped backup writes a consistent database-plus-artifact snapshot
    with hashes and schema version. Restore into an empty root validates integrity
    before the destination is ready. A restore drill verifies a snapshot without
    replacing the live current project. migrateWithBackup records a backup before
    calling existing migrateSchema.
- story_id: e15s04
  type: ADDED
  requirement: Controlled deletion of derived content and caches
  after: Authorized deletion unlinks application-controlled originals, derived copies,
    caches and app-managed backups, writes an evidence tombstone, and keeps permitted
    non-sensitive decision history. Dependent claims need revalidation for new committed
    use. Execution that needs removed inputs is blocked. Prior external disclosures
    are reported as not recalled.
- story_id: e15s05
  type: ADDED
  requirement: Stale restore cannot reinstate withdrawn grants
  after: Restoring a packet or backup onto a project that already withdrew or expired
    a grant cannot flip that grant to active. Current disclosure after restore still
    denies withdrawn uses. Cross-branch snapshots stay isolated. External disclosures
    remain not-recalled notices.
