---
id: e15
title: Recovery portability and controlled deletion
scope_ids:
- R15
outcome: Owners recover and move projects without losing commitments or resurrecting
  revoked data use.
boundaries:
  includes:
  - Versioned project export/restore checks integrity and current permissions; migrations,
    backups and restore drills preserve permitted history and evidence resolution.
  - Crash injection, interrupted writes, disk-full, corruption and concurrent launches
    produce no partial approvals or silent canonical changes; uncertain external operations
    are reconciled before retry.
  - Deletion propagates through derived content, caches and backup policy while retaining
    only permitted audit stubs; stale restores cannot silently reinstate withdrawn
    grants and external disclosures are not promised recall.
  excludes:
  - Product outcomes owned by other epics; shared integration remains required.
  - Markdown/DOCX writing exports, BibTeX/RIS bibliography files, CSV analysis tables
    and supervisor review packets; E13 owns writing/review exchange and E06 already
    owns those import formats.
  - TUI help/command registration, native viewers and launcher intake; E14 stays frozen.
  - Diagnostic log exports, runbooks and performance budgets; E16 owns those.
  - Uninstall, signing and distribution; E18 owns those.
  - Human commitments, scholarly findings and reasoned overrides as writers; E04 owns
    those rows. E15 may copy permitted history and must not call recordOwnerDecision.
  - Whole-OS disk exhaustion, remote object-store backup vendors, zip/tar packages
    and a second database.
depends_on:
