---
id: e18
title: Installable maintained local release
scope_ids:
- R18
outcome: Researchers receive a verified distributable product with complete operating
  and support documentation.
boundaries:
  includes:
  - Clean supported local environments launch the packaged CLI and pass smoke checks;
    upgrade, migration compatibility, rollback/recovery and uninstall preserve user
    research data as documented.
  - Reproducible packaging, artifact integrity, dependency/license inventory and applicable
    signing requirements are verified for the chosen distribution channel.
  - User/developer/accessibility/privacy/local-execution guides, examples, limitations,
    release notes and support/maintenance procedures ship with the product.
  - Local Conventional Commits/SemVer release procedures require explicit publication
    authorization; no hosted service or mandatory remote CI is introduced; all release
    gates are satisfied before shipment.
  excludes:
  - Product outcomes owned by other epics; shared integration remains required.
  - Homebrew formula, Apple .pkg, notarization, or a signed macOS app as the primary
    channel. Capsule directory e18-macos-distribution is a stable roadmap ID; macOS
    is not a product boundary.
  - Inventing verified status for an OS/arch that did not pass smoke on that combination.
  - Declaring a Ganesh SPDX license. Product license stays undeclared / all rights
    reserved unless the owner supplies an SPDX identifier before implementation.
  - Hosted CI, automatic npm publish, pushing tags, or setting production-ready.
  - Completing B06 named qualified-human reviews. Shipment stays blocked without them.
  - Changing PROJECT_SCHEMA_VERSION, PacketKind, OWNER_OPERATIONS, E15 deletion APIs,
    or unfreezing src/workspace/**.
  - New production npm packages, a second database, or a separate web application.
  - Official academic, ethics, clinical, statistical or legal certification.
depends_on:
- e17
