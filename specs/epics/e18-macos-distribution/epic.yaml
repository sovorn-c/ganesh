plan_pins:
  distribution_channel: npm-pack-tarball
  channel_rationale: package.json already declares bin ganesh; SCOPE keeps macOS out
    of the product boundary; hosted CI and automatic publication are out of scope.
    Install paths are developer git-tag plus npm ci, or npm install of an authorized
    tarball. Registry publish is a human step after explicit authorization, not a
    default command.
  signing_applicability: sha256-digest-plus-lockfile-integrity
  apple_codesign: not-applicable
  npm_provenance: not-applicable-until-authorized-registry-publication
  product_license: undeclared-all-rights-reserved
  support_matrix_honesty: verified-combinations-only
requirement_deltas:
- story_id: e18s01
  type: ADDED
  requirement: Support matrix and packaged CLI smoke
  after: A support-matrix catalog records OS, arch, Node.js 24 and npm combinations
    as verified or unverified. A packaged ganesh CLI launches with --print-launch
    and passes smoke on each verified combination. Unverified combinations cannot
    be reported as supported.
- story_id: e18s01
  type: MODIFIED
  requirement: Platform target language in operator docs
  before: README stated macOS is the current product target and broader platform
    support has not been verified.
  after: Operator docs point at the support matrix. Verified combinations are listed
    with evidence. Unverified combinations stay unverified. macOS is not an inherent
    product boundary.
- story_id: e18s02
  type: ADDED
  requirement: Reproducible package integrity, licenses and signing applicability
  after: npm pack produces a tarball whose files whitelist, SHA-256 digest, lockfile
    integrity, third-party license inventory including LGPL-3.0 notices for
    biblatex-csl-converter, and signing-applicability record can be verified.
    Missing digest, incomplete inventory or a claimed Apple codesign for this
    channel fails closed.
- story_id: e18s03
  type: ADDED
  requirement: Upgrade, rollback and product uninstall preserve research data
  after: Installing a newer tarball, rolling back to the previous tarball with E15
    backup/restore, and npm uninstall of the product leave project .ganesh research
    data in place. Product uninstall is not E15 deletion.
- story_id: e18s04
  type: ADDED
  requirement: Shipped guides, examples, limitations, release notes and support
  after: A guide inventory requires user, developer, accessibility, privacy and
    local-execution guides plus examples, limitations, release notes and support
    procedures inside the package. Missing required ids fail closed. E16 runbooks
    are included, not rewritten.
- story_id: e18s05
  type: ADDED
  requirement: Explicit-authorization SemVer procedure
  after: A local release procedure consumes npm run qualify, the packaging evidence
    record and Conventional Commits. Publication stays not-authorized unless the
    operator passes an explicit authorization flag. The procedure does not npm
    publish, push, tag, or set hosted-ci or production-ready.
- story_id: e18s05
  type: MODIFIED
  requirement: Qualification gate R18 outcome
  before: runReleaseQualification always emitted R18 status blocked and never read
    packaging evidence, so shipment stayed blocked even if a catalog row claimed
    passed.
  after: R18 is passed only when validatePackagingEvidence accepts the matrix,
    package manifest, license inventory, signing-applicability record, guide
    inventory and release-procedure record. A catalog passed row without those
    artifacts is rejected as invented evidence. Shipment stays blocked while B06
    qualified-human coverage is absent, a critical safety defect is open, or any
    outcome is blocked or unimplemented.
