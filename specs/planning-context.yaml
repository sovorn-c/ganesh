# Confirmed through elaborate-spec. No epics or implementation plan are defined here.
feature_name: Ganesh complete production release
problem_statement: >-
  Individual researchers need persistent, evidence-grounded supervision support across
  the research lifecycle. Generic chat tools do not reliably preserve evidence,
  interpretations, methodological commitments, or the reasons for past decisions.
  Ganesh prepares and carries out bounded research work while the human researcher
  retains responsibility for consequential commitments.
actors:
  - Individual researcher and designated project owner
  - Real academic supervisor providing attributed feedback through packet exchange
  - Relevant external institutional and community authorities
constraints:
  - One complete local-first release, not a reduced feature set disguised as delivery sequencing
  - Terminal-first, local-folder operation; the initial validation host may be macOS, but macOS is not an inherent product boundary
  - TypeScript and Node.js 24 LTS target; Pi SDK/TUI compatibility is treated as settled from prior verification
  - Reuse Pi SDK and existing terminal UI through a curated Ganesh launcher and extensions
  - Reuse current provider integrations, workflows, and relevant skills; provider authorization, credentials, limits, failures, provenance, and destination restrictions remain explicit
  - SQLite canonical project records plus local artifact files; no graph database is required
  - Research commitments and permissions are independent of conversation history
  - Remote model use requires authorization for the transmitted material and destination
  - Restricted material remains local; no unauthorized cloud fallback
  - Fully offline AI is not a release requirement; saved project records remain inspectable offline
  - User-controlled local analysis and test execution is language-agnostic and follows Pi-compatible ask, approve, and full-access modes
  - A per-project configurable bash guard can deny or require approval for user-selected commands; full-access is an explicit local-risk choice, not a sandbox guarantee
  - Missing tools and packages are surfaced; installation is allowed only under the selected execution mode
  - External viewers support full-document inspection without a separate Ganesh web application
  - New local imports remain local-only until classified and authorized for a destination and purpose
  - Approved work contracts permit bounded autonomous work without repeated delegation prompts
  - Finite token, call, and time limits persist across restarts; known pricing also permits a spend cap
  - No environment initialization, epic planning, or implementation in this discovery task
in_scope:
  - Topic and problem exploration, contribution reasoning, and research questions
  - Authorized literature discovery, screening, reading, appraisal, synthesis, and counter-search
  - Philosophy, theory, methodology, design, sampling, measurement, and analysis planning
  - Ethics-risk preparation, data-management planning, and external authorization tracking
  - Protocol progress, amendments, and deviations
  - User-controlled local analysis and test execution of approved inputs in the researcher's selected language and environment
  - Interpretation, claim qualification, writing, citation checks, and review responses
  - Supervisor feedback exchange and supervision preparation
  - Exact-version decisions, research alternatives, status, cancellation, and recovery
  - Permitted export, restore, deletion, and explicit evidence unavailability
supported_methodological_contexts:
  - Empirical social science
  - Information Systems
  - HCI
  - Education
  - Computing and design-science research
method_profiles:
  - Quantitative
  - Qualitative
  - Mixed methods
  - Artifact evaluation and design science
required_formats:
  import: [text-based PDF, DOCX, Markdown, text, BibTeX, RIS, CSV, XLSX]
  export: [Markdown, DOCX, BibTeX, RIS, CSV, versioned project packets, review packets]
  scanned_pdf: Report extraction as unsupported unless externally OCR-processed with provenance
out_of_scope:
  - Built-in OCR
  - Official academic, ethics, clinical, statistical, or legal certification
  - Autonomous participant recruitment, contact, consent, or data collection
  - Physical experiment execution or laboratory equipment control
  - Automatic external submissions
  - Shared hosted accounts or live multi-user editing
  - Universal disciplinary competence
  - Paywall evasion or redistribution without rights
  - Model training, bundled model weights, or a separate web application
success_criteria:
  - Human commitments reference exact artifact and dependency versions
  - Evidence and contrary findings remain inspectable and attributable
  - Sensitive-data permissions govern derived content and all disclosure paths
  - Interrupted work recovers without partial approvals or silent commitment changes
  - Analysis outputs retain input, command or code, environment details when available, parameters, and diagnostics where available
  - Research cases are assessed by qualified humans as well as deterministic tests
  - Negative and inconclusive findings are valid outcomes
key_decisions:
  - decision: Reuse Pi runtime and terminal UI instead of rebuilding the harness or a browser workspace
    rationale: The local-folder workflow fits Pi, while Ganesh adds research-specific policy and durable state
  - decision: Keep Ganesh terminal-first and local-folder based rather than making macOS an inherent product boundary
    rationale: The terminal and local workflow are the product shape; the initial host can be validated separately from the product design
  - decision: Use SQLite and relational dependency edges as the canonical research store
    rationale: Research graphs and workflow dependencies can be queried from relational records without a second graph database
  - decision: Reuse current provider integrations and relevant skills
    rationale: Existing workflows cover provider-specific access patterns; Ganesh adds authorization, provenance, limits, and destination policy rather than replacing them
  - decision: Support user-controlled, language-agnostic local execution through Pi-compatible permission modes and a project bash guard
    rationale: Researchers have different environments; Ganesh should not mandate Python, R, or a sandbox while still exposing an explicit local-risk control
  - decision: Ship the complete research lifecycle for individual researchers
    rationale: Engineering order must not silently remove later research activities
  - decision: Use the current host for initial validation without making macOS an inherent product boundary
    rationale: A terminal-first local-folder workflow can remain portable; distribution support is chosen and verified separately
  - decision: Allow authorized configured model providers without requiring offline AI
    rationale: Local ownership and data policy do not require bundling or guaranteeing local inference
  - decision: Allow user-selected local analysis languages and tools
    rationale: Research environments differ; Ganesh records and supervises work without bundling or mandating a particular runtime
  - decision: Ground NZ institutional and cultural requirements in identified authoritative material
    rationale: Generic checklists cannot represent every institution or community
  - decision: Allow reasoned human overrides of scholarly objections
    rationale: Preserve the objection and justification without converting it to a pass; safety and external authorization remain non-waivable
  - decision: Permit bounded autonomous execution of approved work contracts
    rationale: Avoid repeated delegation prompts while preserving scope, budget, and human commitment boundaries
  - decision: Require classification before external disclosure of newly imported local material
    rationale: A research-folder location does not establish permission to upload its contents
confirmation:
  status: confirmed
  source: Interactive owner confirmation during elaborate-spec and grill-me
  next_gate: null
  discovery_followup: Domain model confirmed; glossary and local prior-art review recorded
